<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1080" height="640" fill="#0d1117"/>
  <text x="540" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#e6edf3">SUBLEQ Instruction and Memory Model</text>
  <text x="540" y="66" text-anchor="middle" font-size="14" fill="#8b949e">mem[b] ← mem[b] − mem[a]; if result ≤ 0 then PC ← c else PC ← PC + 3</text>

  <!-- memory -->
  <text x="60" y="110" font-size="15" font-weight="bold" fill="#e6edf3">Memory — 65,536 cells, exact integers</text>
  <g font-size="13">
    <rect x="60" y="125" width="90" height="44" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="143" text-anchor="middle" fill="#8b949e">cell 0</text>
    <text x="105" y="161" text-anchor="middle" fill="#e6edf3">251 (t)</text>
    <rect x="150" y="125" width="90" height="44" fill="#161b22" stroke="#30363d"/>
    <text x="195" y="143" text-anchor="middle" fill="#8b949e">cell 1</text>
    <text x="195" y="161" text-anchor="middle" fill="#e6edf3">251 (t)</text>
    <rect x="240" y="125" width="90" height="44" fill="#161b22" stroke="#30363d"/>
    <text x="285" y="143" text-anchor="middle" fill="#8b949e">cell 2</text>
    <text x="285" y="161" text-anchor="middle" fill="#e6edf3">3 (next)</text>
    <rect x="330" y="125" width="90" height="44" fill="#161b22" stroke="#30363d"/>
    <text x="375" y="143" text-anchor="middle" fill="#8b949e">cell 3</text>
    <text x="375" y="161" text-anchor="middle" fill="#e6edf3">274 (__tmp)</text>
    <text x="440" y="155" fill="#8b949e">…</text>
    <rect x="470" y="125" width="100" height="44" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="520" y="143" text-anchor="middle" fill="#58a6ff">cell 246 (ptr)</text>
    <text x="520" y="161" text-anchor="middle" fill="#e6edf3">256 (tape)</text>
    <rect x="570" y="125" width="100" height="44" fill="#161b22" stroke="#30363d"/>
    <text x="620" y="143" text-anchor="middle" fill="#8b949e">cell 247 (state)</text>
    <text x="620" y="161" text-anchor="middle" fill="#e6edf3">0 (scan)</text>
    <rect x="670" y="125" width="100" height="44" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="720" y="143" text-anchor="middle" fill="#d29922">cell 255 (guard)</text>
    <text x="720" y="161" text-anchor="middle" fill="#e6edf3">2 (blank)</text>
    <rect x="770" y="125" width="100" height="44" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="820" y="143" text-anchor="middle" fill="#3fb950">cells 256–271</text>
    <text x="820" y="161" text-anchor="middle" fill="#e6edf3">tape, 16 cells</text>
    <rect x="870" y="125" width="100" height="44" fill="#161b22" stroke="#30363d"/>
    <text x="920" y="143" text-anchor="middle" fill="#8b949e">cells 272–275</text>
    <text x="920" y="161" text-anchor="middle" fill="#e6edf3">0, 1, 0, 0</text>
  </g>
  <text x="60" y="196" font-size="12" fill="#8b949e">Code occupies cells 0–245 (246 cells). Data occupies cells 246–275 (30 cells, including 4 reserved cells 272–275).</text>

  <!-- instruction triple -->
  <text x="60" y="240" font-size="15" font-weight="bold" fill="#e6edf3">One instruction — a triple of cell addresses</text>
  <g font-size="15">
    <rect x="60" y="255" width="130" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="125" y="280" text-anchor="middle" fill="#58a6ff">a = 250</text>
    <text x="125" y="300" text-anchor="middle" font-size="12" fill="#8b949e">tmp2 (operand)</text>
    <rect x="210" y="255" width="130" height="56" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="275" y="280" text-anchor="middle" fill="#3fb950">b = 256</text>
    <text x="275" y="300" text-anchor="middle" font-size="12" fill="#8b949e">tape[ptr] (target)</text>
    <rect x="360" y="255" width="130" height="56" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="425" y="280" text-anchor="middle" fill="#d29922">c = 117</text>
    <text x="425" y="300" text-anchor="middle" font-size="12" fill="#8b949e">L-w1-after (branch)</text>
  </g>
  <text x="60" y="340" font-size="13" fill="#e6edf3">Example: the write triple wr-op at cell 240 — mem[tape[ptr]] ← mem[tape[ptr]] − mem[tmp2].</text>
  <text x="60" y="362" font-size="13" fill="#8b949e">With the cell pre-cleared to 0 and tmp2 = −1, the result is 1: this is how the machine writes a 1 bit.</text>

  <!-- PC -->
  <g>
    <rect x="560" y="250" width="220" height="60" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="670" y="276" text-anchor="middle" font-size="14" fill="#e6edf3">program counter (PC)</text>
    <text x="670" y="298" text-anchor="middle" font-size="13" fill="#8b949e">points at the next triple</text>
    <line x1="490" y1="283" x2="558" y2="283" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="820" y="250" width="200" height="60" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="920" y="276" text-anchor="middle" font-size="14" fill="#e6edf3">status: running</text>
    <text x="920" y="298" text-anchor="middle" font-size="13" fill="#8b949e">halted / error / fuel</text>
  </g>

  <!-- step flow -->
  <text x="60" y="410" font-size="15" font-weight="bold" fill="#e6edf3">One step</text>
  <g font-size="13">
    <rect x="60" y="425" width="190" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="155" y="452" text-anchor="middle" fill="#58a6ff">1 · fetch (a, b, c)</text>
    <text x="155" y="474" text-anchor="middle" fill="#e6edf3">from mem[PC..PC+2]</text>
    <rect x="290" y="425" width="190" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="385" y="452" text-anchor="middle" fill="#3fb950">2 · subtract + store</text>
    <text x="385" y="474" text-anchor="middle" fill="#e6edf3">mem[b] ← mem[b] − mem[a]</text>
    <rect x="520" y="425" width="190" height="70" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="615" y="452" text-anchor="middle" fill="#d29922">3 · test result</text>
    <text x="615" y="474" text-anchor="middle" fill="#e6edf3">result ≤ 0 ?</text>
    <rect x="750" y="425" width="270" height="70" rx="8" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="885" y="452" text-anchor="middle" fill="#e6edf3">4 · next PC</text>
    <text x="885" y="474" text-anchor="middle" fill="#e6edf3">yes → c · no → PC + 3</text>
    <line x1="250" y1="460" x2="288" y2="460" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="480" y1="460" x2="518" y2="460" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="710" y1="460" x2="748" y2="460" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="60" y="530" font-size="13" fill="#e6edf3">Out-of-range operands (outside 0–65535) stop the machine with status error.</text>
  <text x="60" y="552" font-size="13" fill="#e6edf3">A PC outside 0–65535 after a step stops it with status halted — this is how (halt) works: it is the triple (0, 0, −1).</text>
  <text x="60" y="574" font-size="13" fill="#8b949e">Cells hold exact integers (unbounded). The machine has no registers, no opcode field, no flags: the branch is the subtraction.</text>
  <text x="60" y="606" font-size="13" fill="#8b949e">Patchable triples: the read/write triples at cells 222–245 have operand cells rewritten at runtime with the pointer value,</text>
  <text x="60" y="626" font-size="13" fill="#8b949e">so tape[ptr] is addressable with no machine extension — code is data in a uniform memory.</text>
</svg>
